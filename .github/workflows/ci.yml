name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.23.1
  NPM_VERSION: 10.9.8
  PYTHON_VERSION: 3.13.15
  RUST_VERSION: 1.96.0
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15
            runner: macos-15
            install_linux_dependencies: false
          - name: Ubuntu 24.04
            runner: ubuntu-24.04
            install_linux_dependencies: true
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify Python
        run: |
          set -euo pipefail
          test "$(python --version)" = "Python ${PYTHON_VERSION}"
          test "$(python3 --version)" = "Python ${PYTHON_VERSION}"

      - name: Install Ubuntu build dependencies
        if: matrix.install_linux_dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libssl-dev \
            libvulkan-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard-ui/package-lock.json

      - name: Verify Node.js and npm
        run: |
          set -euo pipefail
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"

      - name: Install exact Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_VERSION}" \
            --profile minimal \
            --component clippy \
            --component rustfmt \
            --no-self-update
          test "$(rustc --version | awk '{print $2}')" = "${RUST_VERSION}"
          test "$(cargo --version | awk '{print $2}')" = "${RUST_VERSION}"

      - name: Run the complete local test gate
        env:
          HYDRA_TEST_THREADS: "4"
        run: ./scripts/test-local.sh

      - name: Build the release profile
        run: ./scripts/build-local.sh --release

  msrv:
    name: Rust 1.88 MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Ubuntu build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libssl-dev \
            libvulkan-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Check the declared minimum Rust version
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          test "$(rustc +1.88.0 --version | awk '{print $2}')" = "1.88.0"
          test "$(cargo +1.88.0 --version | awk '{print $2}')" = "1.88.0"
          cargo +1.88.0 check --locked --workspace

  dependency-advisories:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard-ui/package-lock.json

      - name: Verify Node.js and npm
        run: |
          set -euo pipefail
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"

      - name: Audit npm dependencies
        run: npm --prefix dashboard-ui audit --package-lock-only --audit-level=low

      - name: Install exact Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_VERSION}" --profile minimal --no-self-update
          test "$(rustc --version | awk '{print $2}')" = "${RUST_VERSION}"
          test "$(cargo --version | awk '{print $2}')" = "${RUST_VERSION}"

      - name: Install cargo-audit
        run: cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked

      - name: Audit Rust dependencies
        # These three exact advisories affect APIs absent from Hydra's locked source closure.
        # RUSTSEC-2024-0429 is limited to glib::VariantStrIter methods. RUSTSEC-2026-0002 is
        # limited to lru::LruCache::iter_mut. RUSTSEC-2026-0253 is limited to LruCache::pop();
        # locked glyphon 0.6 calls pop_lru(), not pop(), and its GlyphonCacheKey is Copy. This is
        # Hydra's locked-source reachability assessment, not an upstream guarantee. Remove an lru
        # exception when the locked graph uses a RustSec-declared fixed lru, or when glyphon moves
        # off the affected lru; either change requires renderer requalification. Keep every other
        # present or future unsound advisory failing this job.
        run: |
          cargo audit -D unsound \
            --ignore RUSTSEC-2024-0429 \
            --ignore RUSTSEC-2026-0002 \
            --ignore RUSTSEC-2026-0253

  public-boundary:
    name: Public boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify Python
        run: |
          set -euo pipefail
          test "$(python --version)" = "Python ${PYTHON_VERSION}"
          test "$(python3 --version)" = "Python ${PYTHON_VERSION}"

      - name: Install exact Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_VERSION}" --profile minimal --no-self-update
          test "$(rustc --version | awk '{print $2}')" = "${RUST_VERSION}"
          test "$(cargo --version | awk '{print $2}')" = "${RUST_VERSION}"

      - name: Verify the public-only source boundary
        run: ./scripts/check-public-boundary.sh
