[package]
name = "maestro-shell"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shell-owned product metadata for Maestro: projects, workspaces, durable session/task records, versioned storage, and pure workspace-policy resolution without daemon, PTY, git, or renderer coupling."

[features]
default = []
# Unit-test binaries create many isolated AppPaths in one process. Production keeps one cached
# connection per real app-support base; this opt-in test feature may retire cache-only handles
# between distinct bases so macOS's default 256-FD limit remains a meaningful test gate.
test-connection-cache-pruning = []

# A minimal contributor smoke CLI over `ShellRuntime`: resolve+connect to an ALREADY-RUNNING
# daemon and start/attach or reconcile one session. It owns no daemon lifecycle.
[[bin]]
name = "maestro-shell-smoke"
path = "src/bin/maestro_shell_smoke.rs"

[dependencies]
maestro-protocol = { path = "../maestro-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
libc = { workspace = true }
# Embedded SQLite (single-file local store; FK cascade). `bundled` vendors SQLite's C source so there is NO system
# libsqlite3 dependency and the build is reproducible — the user never installs anything.
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Test-only: unique temp dirs so tests never touch the real app-support path.
# `tempfile` is dev-only, so it never enters the shipped crate's dep graph.
tempfile = "3"
