[package]
name = "maestro-app"
version = "0.2.12"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "maestro-app"
path = "src/main.rs"

[lib]
name = "maestro_app"
path = "src/lib.rs"

[features]
# This feature still selects other official-distribution behavior, but it no longer enables the
# unsigned desktop update feed. Every feature set remains update-network-silent until the binary
# can verify an application-pinned signed manifest and the downloaded artifact bytes.
default = []
official-distribution = []

[dependencies]
maestro-protocol = { path = "../maestro-protocol" }
maestro-local-services = { path = "../maestro-local-services" }
maestro-renderer = { path = "../maestro-renderer" }
maestro-shell = { path = "../maestro-shell" }
maestro-extension-api = { path = "../maestro-extension-api" }
serde = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
